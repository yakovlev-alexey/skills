name: Validate Skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  l0-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run L0 validation
        run: ./scripts/validate-skills.sh
